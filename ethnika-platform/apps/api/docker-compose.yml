# Base de données locale de développement : `docker compose up -d` (depuis apps/api).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ethnika-postgres
    environment:
      POSTGRES_USER: ethnika
      POSTGRES_PASSWORD: ethnika
      POSTGRES_DB: ethnika
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ethnika-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethnika"]
      interval: 5s
      retries: 10
volumes:
  ethnika-pg:
